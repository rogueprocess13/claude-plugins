name: Install test and lint deps
description: shellcheck, socat, jq, pytest (apt) and shfmt, as every CI job here needs them.
runs:
  using: composite
  steps:
    - name: Install deps
      # `bash -e {0}`, not `bash`: a composite step's `shell: bash` adds
      # pipefail, and the grep below exits 1 when no google source exists.
      # This is what a plain workflow `run:` step uses.
      shell: bash -e {0}
      run: |
        # The stock runner image preconfigures a google-chrome apt source we
        # never install from (exact filename/format varies by runner image —
        # classic .list or newer deb822 .sources). Its index has
        # intermittently mismatched its own InRelease hash on Google's CDN,
        # which makes `apt-get update` exit non-zero under `set -e` and
        # block installs of packages that don't come from that repo at all.
        # Find and drop any matching source file before updating, rather
        # than depending on Google's mirror being consistent for an
        # unrelated repo, or on one specific filename.
        sudo grep -rl "dl\.google\.com" /etc/apt/sources.list.d/ /etc/apt/sources.list 2>/dev/null | xargs -r sudo rm -f
        sudo apt-get update -qq
        sudo apt-get install -y -qq shellcheck socat jq python3-pytest
        SHFMT_VER=3.10.0
        curl -sSL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VER}/shfmt_v${SHFMT_VER}_linux_amd64" -o /usr/local/bin/shfmt
        chmod +x /usr/local/bin/shfmt
