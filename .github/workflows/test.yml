name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          # The stock runner image preconfigures a google-chrome apt source we
          # never install from (exact filename/format varies by runner image —
          # classic .list or newer deb822 .sources). Its index has
          # intermittently mismatched its own InRelease hash on Google's CDN,
          # which makes `apt-get update` exit non-zero under `set -e` and
          # block installs of packages that don't come from that repo at all.
          # Find and drop any matching source file before updating, rather
          # than depending on Google's mirror being consistent for an
          # unrelated repo, or on one specific filename.
          sudo grep -rl "dl\.google\.com" /etc/apt/sources.list.d/ /etc/apt/sources.list 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck socat jq python3-pytest
          SHFMT_VER=3.10.0
          curl -sSL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VER}/shfmt_v${SHFMT_VER}_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: Lint (ShellCheck)
        run: make lint

      - name: Format check (shfmt)
        run: make fmt-check

      - name: Generated-section drift check
        run: make check-generated

      - name: Observability backend stays out of skills/agents (langfuse-evidence-layer)
        run: |
          if grep -ril langfuse ticket-auto-pipeline/skills ticket-auto-pipeline/agents ticket-planner grill-me knowledge-curator; then
            echo "A skill, agent, or skill-invoked library references the observability backend — this boundary must hold (design.md)." >&2
            exit 1
          fi

      - name: ADR store fixture validation (adr-check.sh)
        # This repo's CI cannot gate content in the separate WIKI_ROOT docs
        # repo (design.md D12) — this instead runs the validator directly
        # against a committed, real ADR store fixture, independent of the
        # bash unit-test harness below. See
        # ticket-auto-pipeline/lib/tests/fixtures/adr-store/README.md.
        run: bash ticket-auto-pipeline/lib/adr-check.sh --wiki-root ticket-auto-pipeline/lib/tests/fixtures/adr-store

      - name: Unit tests
        run: make test

      # Deliberately AFTER the main run, and only here. The suite above runs
      # with no opentelemetry installed, which is what keeps "fleetd works
      # without its one optional dependency" continuously verified rather than
      # assumed. This step then installs it and re-runs the exporter tests, so
      # the real SDK path is covered too and an upstream API change is caught.
      - name: OTel exporter against the real SDK
        run: |
          python3 -m pip install --quiet -r fleet-controller/fleetd/requirements-otel.txt
          python3 -m pytest fleet-controller/fleetd/tests/test_otel.py -v
